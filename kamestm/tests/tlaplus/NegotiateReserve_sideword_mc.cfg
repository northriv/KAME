\* The rejected design: the reservation lives in a second word that the peer
\* tests at observe time, exactly as fair_mode_blocks_me tests the tag today.
\* INV_NoBadWins is EXPECTED TO FAIL — a peer that observed before the
\* reservation landed still CASes after it.  That counterexample is the whole
\* reason the reservation must ride in the value.
SPECIFICATION Spec

CONSTANTS
    Peers = {p1, p2, p3}
    H = h
    K = 2
    TagBeforeAcquire = TRUE
    ReserveMode = "sideword"
    Null = Null

INVARIANT TypeOK
INVARIANT INV_NoBadWins

CHECK_DEADLOCK FALSE
