\* Today's protocol: no reservation, tag planted AFTER the view is acquired
\* (the order transaction_negotiation.h:488-497 actually uses), and K = 2
\* because bundle's Phase 2 and Phase 4 share one negotiate.
\* INV_NoRebuild is vacuous here; the point is that hRebuilds > 0 is reachable.
SPECIFICATION Spec

CONSTANTS
    Peers = {p1, p2, p3}
    H = h
    K = 2
    TagBeforeAcquire = FALSE
    ReserveMode = "none"
    Null = Null

INVARIANT TypeOK
INVARIANT INV_WinsAfterTag
INVARIANT INV_HLosses

PROPERTY LIVE_Done

CHECK_DEADLOCK FALSE
